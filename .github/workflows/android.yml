name: Android CI

# Ausführungsort und Testumfang sind bei manuellen Läufen frei wählbar.
# Automatische Läufe verwenden dokumentierte Standardwerte (siehe
# docs/ci/HYBRID_CI.md): Push/PR = LOCAL (falls freigegeben) + FULL.
run-name: >-
  Android CI · ${{ github.ref_name }} ·
  ${{ github.event_name == 'workflow_dispatch' && inputs.run_environment || 'AUTO' }} ·
  ${{ github.event_name == 'workflow_dispatch' && inputs.test_scope || 'FULL' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_environment:
        description: 'Ausführungsort – LOCAL: eigener Runner, CLOUD: GitHub-hosted'
        type: choice
        required: true
        default: LOCAL
        options:
          - LOCAL
          - CLOUD
      test_scope:
        description: 'Testumfang – QUICK: Build + Unit-Tests, FULL: inkl. Lint + Emulator'
        type: choice
        required: true
        default: QUICK
        options:
          - QUICK
          - FULL

concurrency:
  # LOCAL- und CLOUD-Läufe desselben Refs blockieren sich nicht gegenseitig.
  # Überholte PR-Läufe dürfen enden; ein aktiver Main-/Dispatch-FULL-Lauf darf
  # durch Folge-Pushes nicht gekappt werden. GitHub hält je Gruppe höchstens
  # einen Pending-Lauf und ersetzt diesen bei weiteren Pushes durch den neuesten.
  group: pulselibre-android-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_environment || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Entscheidet Runner und Umfang. Läuft immer auf GitHub-hosted (Sekunden),
  # damit die Entscheidung auch dann fällt, wenn der lokale Runner offline ist.
  prepare:
    name: "CI-Ziel bestimmen"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      requested_environment: ${{ steps.resolve.outputs.requested_environment }}
      scope: ${{ steps.resolve.outputs.scope }}
      runs_on: ${{ steps.resolve.outputs.runs_on }}
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runner und Umfang bestimmen
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.run_environment }}
          REQUESTED_SCOPE: ${{ inputs.test_scope }}
          LOCAL_RUNNER_ENABLED: ${{ vars.PULSELIBRE_LOCAL_RUNNER_ENABLED }}
          PR_ON_LOCAL_ENABLED: ${{ vars.PULSELIBRE_PR_ON_LOCAL_ENABLED }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: bash tools/ci/resolve-target.sh
      - name: Ergebnis protokollieren
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SCOPE: ${{ steps.resolve.outputs.scope }}
          REASON: ${{ steps.resolve.outputs.reason }}
          RUNNER_LABEL: ${{ steps.resolve.outputs.runner_label }}
        run: |
          echo "Umgebung: $ENVIRONMENT"
          echo "Runner:   $RUNNER_LABEL"
          echo "Umfang:   $SCOPE"
          echo "Grund:    $REASON"

  build:
    name: "Build, Unit-Tests, Lint, APK"
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runs_on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Ausführungsziel
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SCOPE: ${{ needs.prepare.outputs.scope }}
          RUNNER_LABEL: ${{ needs.prepare.outputs.runner_label }}
        run: |
          echo "Umgebung: $ENVIRONMENT | Runner: $RUNNER_LABEL | Umfang: $SCOPE"
          {
            echo "### Android CI – Build"
            echo ""
            echo "| Umgebung | Runner | Umfang |"
            echo "|---|---|---|"
            echo "| **$ENVIRONMENT** | \`$RUNNER_LABEL\` | **$SCOPE** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.6.0'
      - name: Android SDK prüfen
        run: bash tools/ci/ensure-android-sdk.sh
      - name: Restore stable APK signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.PULSELIBRE_SIGNING_KEY_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PULSELIBRE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PULSELIBRE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PULSELIBRE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Stable signing secrets missing: CI tests can run, but APK will NOT be published as an update."
          else
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/pulselibre-ci.keystore"
            echo "PULSELIBRE_SIGNING_STORE=$RUNNER_TEMP/pulselibre-ci.keystore" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Python regression tests (validators, workflow structure, runner safety)
        run: bash tools/ci/run-ci.sh python-tests
      - name: Build debug and R8 release variants, run unit tests
        env:
          CI_SCOPE: ${{ needs.prepare.outputs.scope }}
        run: bash tools/ci/run-ci.sh build --scope "$CI_SCOPE"
      - name: Android lint and instrumentation test APK (FULL only)
        env:
          CI_SCOPE: ${{ needs.prepare.outputs.scope }}
        run: bash tools/ci/run-ci.sh verify --scope "$CI_SCOPE"
      - name: APK and signing diagnostics
        run: bash tools/ci/run-ci.sh diagnostics
      - name: Upload JVM JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-jvm-jacoco
          path: |
            app/build/reports/jacoco/
            app/build/outputs/unit_test_code_coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && env.APK_SIGNING_READY == 'true'
        with:
          name: pulselibre-signed-release-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  emulator:
    name: "Emulator-Instrumentationstests (API 35)"
    if: needs.prepare.outputs.scope == 'FULL'
    needs: [prepare, build]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runs_on) }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Ausführungsziel
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SCOPE: ${{ needs.prepare.outputs.scope }}
          RUNNER_LABEL: ${{ needs.prepare.outputs.runner_label }}
        run: |
          echo "Umgebung: $ENVIRONMENT | Runner: $RUNNER_LABEL | Umfang: $SCOPE"
          {
            echo "### Android CI – Emulator"
            echo ""
            echo "| Umgebung | Runner | Umfang |"
            echo "|---|---|---|"
            echo "| **$ENVIRONMENT** | \`$RUNNER_LABEL\` | **$SCOPE** |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.6.0'
      - name: Android SDK prüfen
        run: bash tools/ci/ensure-android-sdk.sh
      - name: Enable KVM
        run: bash tools/ci/ensure-kvm.sh
      - name: Emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tools/ci/run-ci.sh emulator --scope FULL
      - name: Upload instrumentation coverage and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-instrumentation-coverage
          path: |
            app/build/outputs/code_coverage/
            app/build/reports/coverage/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
