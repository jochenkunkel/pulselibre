name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run full release checks including emulator'
        type: boolean
        required: false
        default: true
concurrency:
  # One active run across pushes, PRs, tags and manually launched test suites.
  # Cancels the entire superseded run, including its build, lint and emulator jobs.
  group: pulselibre-single-active-workflow
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and unit tests (every change)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Lint and instrumentation test APK (full checks only)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_tests)
        run: gradle :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulselibre-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pulselibre-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  emulator:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_tests)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: gradle :app:connectedDebugAndroidTest --stacktrace
