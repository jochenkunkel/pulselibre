name: Android CI
run-name: "Android CI · ${{ github.ref_name }} · ${{ github.event_name != 'workflow_dispatch' || inputs.full_tests && 'voll (mit Emulator)' || 'schnell (Build + Unit-Tests)' }}"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run full release checks including emulator'
        type: boolean
        required: false
        default: false
concurrency:
  # Only the newest run per ref remains active; obsolete builds are cancelled.
  group: pulselibre-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: "Build, Unit-Tests, Lint, signierte APK"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.6.0'
      - name: Restore stable APK signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.PULSELIBRE_SIGNING_KEY_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PULSELIBRE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PULSELIBRE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PULSELIBRE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Stable signing secrets missing: CI tests can run, but APK will NOT be published as an update."
          else
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/pulselibre-ci.keystore"
            echo "PULSELIBRE_SIGNING_STORE=$RUNNER_TEMP/pulselibre-ci.keystore" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PULSELIBRE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Python offline HCI validator regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      # PRs and main pushes run the full gate; manual dispatch defaults to quick.
      - name: Build and unit tests
        run: bash .github/scripts/gradle-retry.sh :app:testDebugUnitTest :app:assembleDebug :app:createDebugUnitTestCoverageReport -PpulselibreVersionCode=${{ github.run_number }} --stacktrace
      - name: Print non-secret APK update diagnostics
        run: |
          echo "Package: de.pulselibre"
          echo "Version code: ${{ github.run_number }}"
          echo "Stable signing configured: $([ -n "$PULSELIBRE_SIGNING_STORE" ] && echo yes || echo no)"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E 'Signer #1 certificate SHA-256 digest|Verified using'
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep '^package:'
          if [ -n "$PULSELIBRE_SIGNING_STORE" ]; then
            echo "APK_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "APK_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi
      - name: Full lint and instrumentation test APK
        if: github.event_name != 'workflow_dispatch' || inputs.full_tests
        run: bash .github/scripts/gradle-retry.sh :app:lintDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload JVM JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-jvm-jacoco
          path: |
            app/build/reports/jacoco/
            app/build/outputs/unit_test_code_coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-build-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && env.APK_SIGNING_READY == 'true'
        with:
          name: pulselibre-signed-update-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  emulator:
    name: "Emulator-Instrumentationstests (API 35)"
    if: github.event_name != 'workflow_dispatch' || inputs.full_tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/gradle-retry.sh :app:connectedDebugAndroidTest --stacktrace
      - name: Verify instrumentation coverage was generated
        run: bash .github/scripts/verify-instrumentation-coverage.sh
      - name: Upload instrumentation coverage and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pulselibre-instrumentation-coverage
          path: |
            app/build/outputs/code_coverage/
            app/build/reports/coverage/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
