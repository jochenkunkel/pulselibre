name: Java 21 bytecode compatibility experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bytecode-21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Apply experimental targets in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          original = path.read_text()
          assert 'JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17' in original
          assert 'jvmTarget = "17"' in original
          updated = original.replace(
              'JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17',
              'JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21'
          ).replace('jvmTarget = "17"', 'jvmTarget = "21"')
          path.write_text(updated)
          print("Experiment only: Java source/target 21; Kotlin JVM target 21")
          PY
      - name: Compile and run JVM tests with Java 21 bytecode targets
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java21-bytecode-experiment-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
