name: Audit old workflow artifacts (read-only)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory artifacts without deletion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.created_at, (.id|tostring), .name, (.expired|tostring)] | @tsv' \
            | sort -r > "$RUNNER_TEMP/artifacts.tsv"
          echo "Read-only artifact inventory (no deletion):"
          cat "$RUNNER_TEMP/artifacts.tsv"
          echo "Review ownership, references and retention before proposing any deletion."
