gradle.projectsEvaluated {
    def p = rootProject.project(":app")
    ["createDebugUnitTestCoverageReport", "createDebugAndroidTestCoverageReport", "jacocoDebug"].each { name ->
        def t = p.tasks.findByName(name)
        if (t == null) { println "TASK ${name} MISSING"; return }
        println "TASK ${name} CLASS ${t.class.name}"
        ["executionData", "classDirectories", "sourceDirectories"].each { prop ->
            try { println "  ${prop}=${t.property(prop)?.files}" } catch (e) { println "  ${prop} unavailable: ${e.class.simpleName}" }
        }
    }
}
