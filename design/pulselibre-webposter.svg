<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">PulsLibre – Projektüberblick</title><desc id="desc">Webposter: Android offline-first, CIRQA Bluetooth-Testlabor, GFDI-Protokoll, FIT-Validierung, lokales Dashboard. Bestätigte BLE-Sequenz und offene Grenzen sind gekennzeichnet.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152b"/><stop offset="1" stop-color="#222044"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8258ff"/><stop offset="1" stop-color="#33d3bb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#8e9db7"/></marker></defs><rect width="1440" height="920" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><rect x="50" y="38" width="1340" height="180" rx="28" fill="#222b4a" stroke="#44547c"/><text x="88" y="112" fill="#ffffff" font-size="65" font-weight="bold">PulsLibre</text><text x="92" y="156" fill="#d2d8ed" font-size="24">Deine Gesundheitsdaten. Deine Kontrolle.</text><text x="92" y="190" fill="#89efd7" font-size="18">Android · Offline-first · CIRQA-Protokollforschung · Open Source</text><path d="M900 126 h95 l24 -36 l28 79 l31 -49 l20 8 h190" stroke="url(#hero)" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="272" font-size="23" fill="#ffffff" font-weight="bold">WIE DAS PROJEKT ZUSAMMENHÄNGT</text><rect x="60" y="308" width="270" height="205" rx="18" fill="#24314f" stroke="#a18aff" stroke-width="2"/><rect x="76" y="327" width="9" height="29" rx="4" fill="#a18aff"/><text x="96" y="351" font-size="20" font-weight="bold" fill="#fff">01 · CIRQA / Bluetooth</text><text x="79" y="395" font-size="17" fill="#dbe6f5">BLE-Testlabor &amp; Nutzerfreigabe</text><text x="79" y="429" font-size="17" fill="#dbe6f5">Bootstrap und GFDI-Protokoll</text><text x="79" y="463" font-size="17" fill="#dbe6f5">Classic/RFCOMM geprüft</text><rect x="410" y="308" width="270" height="205" rx="18" fill="#24314f" stroke="#65b8ff" stroke-width="2"/><rect x="426" y="327" width="9" height="29" rx="4" fill="#65b8ff"/><text x="446" y="351" font-size="20" font-weight="bold" fill="#fff">02 · Datenvalidierung</text><text x="429" y="395" font-size="17" fill="#dbe6f5">COBS · CRC · GFDI-Frames</text><text x="429" y="429" font-size="17" fill="#dbe6f5">FIT-Header &amp; FIT-CRC</text><text x="429" y="463" font-size="17" fill="#dbe6f5">Begrenzter Offline-Decoder</text><rect x="760" y="308" width="270" height="205" rx="18" fill="#24314f" stroke="#55d7bd" stroke-width="2"/><rect x="776" y="327" width="9" height="29" rx="4" fill="#55d7bd"/><text x="796" y="351" font-size="20" font-weight="bold" fill="#fff">03 · Lokale Daten</text><text x="779" y="395" font-size="17" fill="#dbe6f5">Privater Speicher &amp; SQLite</text><text x="779" y="429" font-size="17" fill="#dbe6f5">Herkunft und Datenqualität</text><text x="779" y="463" font-size="17" fill="#dbe6f5">Keine Cloud, keine Telemetrie</text><rect x="1110" y="308" width="270" height="205" rx="18" fill="#24314f" stroke="#ffc477" stroke-width="2"/><rect x="1126" y="327" width="9" height="29" rx="4" fill="#ffc477"/><text x="1146" y="351" font-size="20" font-weight="bold" fill="#fff">04 · Dashboard</text><text x="1129" y="395" font-size="17" fill="#dbe6f5">Puls · Schritte · SpO₂</text><text x="1129" y="429" font-size="17" fill="#dbe6f5">Werte nur mit Evidenz</text><text x="1129" y="463" font-size="17" fill="#dbe6f5">Keine erfundenen Scores</text><path d="M340 409 H395" stroke="#a7bad8" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 409 H745" stroke="#a7bad8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1040 409 H1095" stroke="#a7bad8" stroke-width="3" marker-end="url(#arrow)"/><text x="58" y="577" font-size="23" fill="#fff" font-weight="bold">WAS AM ECHTEN GERÄT BELEGT IST</text><rect x="60" y="602" width="1320" height="105" rx="18" fill="#173d3b" stroke="#44c9aa" stroke-width="2"/><text x="88" y="644" font-size="23" fill="#a6fbe7" font-weight="bold">BLE: 5024 / 5050 → 5030 → 5007 → 5031 → 5002 → 5004</text><text x="88" y="679" font-size="19" fill="#fff">5031: 12 Dateitypen · 5002: 8192 Bytes gemeldet · 5004: nur 32-Byte-Platzhalter</text><rect x="60" y="730" width="642" height="108" rx="18" fill="#48321f" stroke="#e4aa63"/><text x="84" y="765" font-size="21" fill="#ffe0b2" font-weight="bold">NOCH NICHT ERREICHT</text><text x="84" y="799" font-size="18" fill="#fff">Kein historischer FIT-Download oder Live-Import</text><rect x="726" y="730" width="654" height="108" rx="18" fill="#4a2839" stroke="#f48caa"/><text x="751" y="765" font-size="21" fill="#ffd1df" font-weight="bold">TRANSPORTFORSCHUNG</text><text x="751" y="799" font-size="18" fill="#fff">RFCOMM ohne Gegenverbindung · Protobuf offline</text><text x="60" y="884" font-size="16" fill="#aabbd5">Forschungsstand: 18.11.2026 · Konzept- und Codeübersicht, keine medizinische Freigabe · Details: docs/protocol/research/</text></g></svg>