<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="t d"><title id="t">PulsLibre – Deine Gesundheitsdaten. Deine Kontrolle.</title><desc id="d">Modernes Projektposter: aus Genesungserfahrung entstanden; Selbstbestimmung, Offline-first, Transparenz, Wissenschaft und Sicherheit. Zielbild vom CIRQA-Armband über Bluetooth und validierte FIT-Daten zum lokalen Dashboard. Historischer FIT-Download ist noch offen.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f8f5ff"/><stop offset="1" stop-color="#ede6ff"/></linearGradient><linearGradient id="violet" x2="1"><stop stop-color="#47118d"/><stop offset="1" stop-color="#8c49df"/></linearGradient><linearGradient id="mint" x2="1"><stop stop-color="#28e0c1"/><stop offset="1" stop-color="#9bf6df"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#542a9a" flood-opacity=".12"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#6333a2"/></marker></defs><rect width="1600" height="1080" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><rect x="56" y="48" width="86" height="86" rx="24" fill="url(#violet)"/><path d="M70 94h15l10-23 15 46 12-27h12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="109" font-size="66" font-weight="bold" fill="#411078">PulsLibre</text><text x="164" y="139" font-size="18" letter-spacing="3" fill="#72558d">OPEN SOURCE FÜR DEINE GESUNDHEITSDATEN</text><rect x="1178" y="63" width="356" height="51" rx="25" fill="#e9defa"/><text x="1203" y="96" font-size="20" font-weight="bold" fill="#59268e">OFFLINE-FIRST · ANDROID</text><text x="58" y="236" font-size="71" font-weight="bold" fill="#351069">Deine Gesundheitsdaten.</text><text x="58" y="316" font-size="71" font-weight="bold" fill="#351069">Deine Kontrolle.</text