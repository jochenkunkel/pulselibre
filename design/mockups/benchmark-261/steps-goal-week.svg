<g font-size="10" fill="#9fb0c5">
<text x="24" y="302">Ø Schritte</text><text x="250" y="302" fill="#e8eef7">7 412 · 6/7 Tage</text>
<text x="24" y="324">Ø Ruhepuls</text><text x="250" y="324" fill="#e8eef7">58 bpm · 5/7 Tage</text>
